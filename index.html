<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Super Punekar</title>
<meta name="description" content="A retro platformer set in Pune: stomp angry autos, kick Sinhagad monkeys and win back the Ganeshotsav modaks.">
<meta name="theme-color" content="#120c1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root {
    --night: #120c1c;
    --ink: #1a1020;
    --saffron: #f5821f;
    --marigold: #fcd23c;
    --cream: #fff4d0;
    --pad-bg: rgba(26, 16, 32, 0.42);
    --pad-edge: rgba(255, 244, 208, 0.7);
    --ui-font: 'Press Start 2P', ui-monospace, 'Courier New', monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--night);
    color: var(--cream);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    right: env(safe-area-inset-right, 0px);
    bottom: env(safe-area-inset-bottom, 0px);
    left: env(safe-area-inset-left, 0px);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--night);
  }
  #game {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    box-shadow: 0 0 0 2px #000, 0 8px 40px rgba(0, 0, 0, 0.6);
    outline: none;
  }
  /* ---------- touch controls ---------- */
  /* Button size follows the screen: height in landscape, width in portrait. */
  :root { --btn: clamp(46px, 17vh, 78px); --gap: clamp(6px, 2vh, 12px); }
  .pad, .sys { display: none; }
  body.touch .pad, body.touch .sys { display: flex; }
  .pad {
    position: absolute;
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    gap: var(--gap);
    align-items: flex-end;
    touch-action: none;
    padding: 6px;
  }
  .pad-left { left: calc(8px + env(safe-area-inset-left, 0px)); }
  .pad-right { right: calc(8px + env(safe-area-inset-right, 0px)); }
  .btn {
    display: grid;
    place-items: center;
    width: var(--btn);
    height: var(--btn);
    border-radius: 50%;
    border: 2px solid var(--pad-edge);
    background: var(--pad-bg);
    color: var(--cream);
    font: calc(var(--btn) * 0.2) / 1 var(--ui-font);
    box-sizing: border-box;
    transition: transform 60ms, background 60ms;
  }
  .btn svg { width: 40%; height: 40%; fill: currentColor; }
  .btn.small { width: calc(var(--btn) * 0.74); height: calc(var(--btn) * 0.74); margin-bottom: calc(var(--btn) * 0.1); }
  .btn.a { width: calc(var(--btn) * 1.15); height: calc(var(--btn) * 1.15); margin-bottom: calc(var(--btn) * 0.45); background: rgba(226, 53, 43, 0.5); }
  .btn.b { background: rgba(245, 130, 31, 0.42); }
  .btn.on { transform: scale(0.92); background: rgba(252, 210, 60, 0.6); color: var(--ink); }
  /* pause and sound sit in the empty middle of the HUD */
  .sys {
    position: absolute;
    top: calc(6px + env(safe-area-inset-top, 0px));
    left: 50%;
    transform: translateX(-50%);
    gap: 8px;
  }
  .sys button {
    width: 40px;
    height: 30px;
    border-radius: 8px;
    border: 2px solid var(--pad-edge);
    background: var(--pad-bg);
    color: var(--cream);
    display: grid;
    place-items: center;
    padding: 0;
  }
  .sys button svg { width: 18px; height: 18px; fill: currentColor; }
  .sys button.off .wave { display: none; }
  .sys button:focus-visible, .name-box button:focus-visible, .rotate-card button:focus-visible { outline: 2px solid var(--marigold); outline-offset: 2px; }
  /* portrait: game at the top, controls get the space underneath */
  @media (orientation: portrait) {
    :root { --btn: clamp(50px, 15vw, 72px); }
    body.touch #stage { align-items: flex-start; padding-top: 52px; }
    body.touch .pad { bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }
    body.touch .pad-right { bottom: calc(28px + env(safe-area-inset-bottom, 0px) + var(--btn) * 0.9); }
  }
  /* ---------- rotate prompt ---------- */
  .rotate {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--night);
  }
  .rotate-card { display: grid; justify-items: center; gap: 16px; text-align: center; max-width: 320px; }
  .rotate-card h2 { margin: 0; font: 14px/1.6 var(--ui-font); color: var(--marigold); }
  .rotate-card p { margin: 0; font: 9px/1.9 var(--ui-font); color: var(--cream); opacity: 0.85; }
  .phone {
    width: 56px;
    height: 96px;
    border: 4px solid var(--cream);
    border-radius: 10px;
    position: relative;
    animation: turn 2.4s ease-in-out infinite;
    margin: 18px 0;
  }
  .phone::before { content: ''; position: absolute; inset: 8px 6px 14px; background: linear-gradient(#5aa8ec, #b0daf8 60%, #c0643a 60%); }
  .phone::after { content: ''; position: absolute; left: 50%; bottom: 4px; width: 8px; height: 3px; margin-left: -4px; background: var(--cream); border-radius: 2px; }
  @keyframes turn { 0%, 25% { transform: rotate(0deg); } 55%, 100% { transform: rotate(-90deg); } }
  @media (prefers-reduced-motion: reduce) { .phone { animation: none; transform: rotate(-90deg); } }
  .rotate-card button {
    font: 10px/1 var(--ui-font);
    padding: 12px 16px;
    border: 2px solid #000;
    background: var(--marigold);
    color: var(--ink);
    cursor: pointer;
  }
  .rotate-card button.secondary { background: transparent; color: var(--cream); border-color: var(--pad-edge); }
  /* ---------- name entry ---------- */
  .name-box {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(10, 6, 16, 0.7);
    padding: 16px;
  }
  .name-card {
    display: grid;
    gap: 14px;
    width: min(360px, 100%);
    box-sizing: border-box;
    padding: 18px;
    background: var(--ink);
    border: 3px solid var(--saffron);
    box-shadow: 0 0 0 3px #000;
  }
  .name-card label { font: 11px/1.6 var(--ui-font); color: var(--marigold); }
  .name-card p { margin: 0; font: 8px/1.8 var(--ui-font); color: var(--cream); opacity: 0.8; }
  #name-input {
    font: 16px/1.4 var(--ui-font);
    text-transform: uppercase;
    padding: 10px;
    background: #fff4d0;
    color: var(--ink);
    border: 2px solid #000;
    border-radius: 0;
    width: 100%;
    box-sizing: border-box;
    user-select: text;
    -webkit-user-select: text;
  }
  .name-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .name-actions button {
    font: 10px/1 var(--ui-font);
    padding: 10px 14px;
    border: 2px solid #000;
    background: var(--marigold);
    color: var(--ink);
    cursor: pointer;
  }
  .name-actions button.secondary { background: #8e909e; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="Super Punekar game screen" tabindex="0"></canvas>

  <div class="pad pad-left" aria-hidden="true">
    <div class="btn" data-btn="left"><svg viewBox="0 0 24 24"><path d="M16 4 6 12l10 8z"/></svg></div>
    <div class="btn small" data-btn="down"><svg viewBox="0 0 24 24"><path d="M4 8h16l-8 10z"/></svg></div>
    <div class="btn" data-btn="right"><svg viewBox="0 0 24 24"><path d="m8 4 10 8-10 8z"/></svg></div>
  </div>
  <div class="pad pad-right" aria-hidden="true">
    <div class="btn b" data-btn="run">B</div>
    <div class="btn a" data-btn="jump">A</div>
  </div>
  <div class="sys">
    <button id="btn-pause" type="button" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg></button>
    <button id="btn-mute" type="button" aria-label="Sound on or off"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8a5 5 0 0 1 0 8l-1.4-1.4a3 3 0 0 0 0-5.2zM18.5 5.5a8.5 8.5 0 0 1 0 13l-1.4-1.4a6.5 6.5 0 0 0 0-10.2z"/></svg></button>
  </div>
  <div id="rotate" class="rotate" hidden>
    <div class="rotate-card">
      <div class="phone" aria-hidden="true"></div>
      <h2>TURN YOUR PHONE SIDEWAYS</h2>
      <p>Super Punekar plays best in landscape, with a button under each thumb.</p>
      <button type="button" id="rotate-full" hidden>PLAY FULL SCREEN</button>
      <button type="button" id="rotate-skip" class="secondary">KEEP PLAYING UPRIGHT</button>
    </div>
  </div>

  <form id="name-entry" class="name-box" hidden>
    <div class="name-card">
      <label for="name-input">WHAT IS THE HERO'S NAME?</label>
      <input id="name-input" name="hero" maxlength="10" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="PUNEKAR">
      <p>Up to 10 letters. It appears on the title, the HUD and the ending.</p>
      <div class="name-actions">
        <button type="button" id="name-cancel" class="secondary">CANCEL</button>
        <button type="submit">OK</button>
      </div>
    </div>
  </form>
</div>

<script src="src/core.js"></script>
<script src="src/font.js"></script>
<script src="src/input.js"></script>
<script src="src/audio.js"></script>
<script src="src/sprites.js"></script>
<script src="src/scenery.js"></script>
<script src="src/world.js"></script>
<script src="src/levels.js"></script>
<script src="src/entities.js"></script>
<script src="src/game.js"></script>
<script>
  (function () {
    var hot = window.claude && window.claude.hot;
    if (hot && hot.ready) hot.ready(boot);
    else boot((hot && hot.data) || null);
  })();
</script>
</body>
</html>
